<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu Management | Alleppey PUB ERP</title>

    <link rel="stylesheet" href="../css/menu-management.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- ===========================
         HEADER
    ============================ -->

    <header class="top-bar">

        <button class="back-btn" onclick="window.location.href='../html/admin-dashboard.html'">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </button>

        <h1>MENU MANAGEMENT</h1>

        <button class="add-btn" id="openModal" type="button">
            <i class="fa-solid fa-plus"></i> Add Item
        </button>

    </header>

    <!-- ===========================
         SEARCH & FILTER
    ============================ -->

    <section class="toolbar">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search menu item...">

        </div>

        <select id="categoryFilter">

            <option value="All">All Categories</option>
            <option value="Beer">Beer</option>
            <option value="Cocktails">Cocktails</option>
            <option value="Whisky">Whisky</option>
            <option value="Wine">Wine</option>
            <option value="Food">Food</option>
            <option value="Snacks">Snacks</option>
            <option value="Desserts">Desserts</option>

        </select>

        <button class="refresh-btn" id="refreshMenu" type="button">
            <i class="fa-solid fa-rotate"></i>
            Refresh
        </button>

    </section>

    <p class="menu-message" id="menuMessage" role="status">
        Loading menu from the database...
    </p>

    <!-- ===========================
         MENU TABLE
    ============================ -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Image</th>

                    <th>Name</th>

                    <th>Description</th>

                    <th>Category</th>

                    <th>Price (₹)</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="menuTableBody">

                <!-- JavaScript will insert rows here -->

            </tbody>

        </table>

    </div>

</div>

<!-- ======================================
     ADD / EDIT MENU ITEM MODAL
======================================= -->

<div class="modal" id="menuModal">

    <div class="modal-content">

        <span class="close-btn" id="closeModal">&times;</span>

        <h2>Add Menu Item</h2>

        <form id="menuForm">

            <div class="form-group">

                <label>Image URL</label>

                <input
                    type="text"
                    id="itemImage"
                    placeholder="Enter image URL">

            </div>

            <div class="form-group">

                <label>Item Name</label>

                <input
                    type="text"
                    id="itemName"
                    placeholder="Enter item name"
                    required>

            </div>

            <div class="form-group">

                <label>Description</label>

                <textarea
                    id="itemDescription"
                    rows="3"
                    placeholder="Enter description"></textarea>

            </div>

            <div class="form-group">

                <label>Category</label>

                <select id="itemCategory">

                    <option>Beer</option>

                    <option>Cocktails</option>

                    <option>Whisky</option>

                    <option>Wine</option>

                    <option>Food</option>

                    <option>Snacks</option>

                    <option>Desserts</option>

                </select>

            </div>

            <div class="form-group">

                <label>Price (₹)</label>

                <input
                    type="number"
                    id="itemPrice"
                    step="0.01"
                    required>

            </div>

            <div class="form-group">

                <label>Status</label>

                <select id="itemStatus">

                    <option>Available</option>

                    <option>Out of Stock</option>

                    <option>Hidden</option>

                </select>

            </div>

            <button
                type="submit"
                class="save-btn">

                <i class="fa-solid fa-floppy-disk"></i>
                Save Item

            </button>

        </form>

    </div>

</div>

<script src="../js/config.js"></script>
<script src="../js/menu-management.js"></script>

</body>

</html>
