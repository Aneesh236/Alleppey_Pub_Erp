<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Alleppey Pub & Bar ERP</title>

    <link rel="stylesheet"
          href="../css/splash.css?v=7">

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

    <!-- Background layers -->

    <div class="background-overlay"></div>

    <div class="background-glow glow-one"></div>

    <div class="background-glow glow-two"></div>


    <!-- Main splash content -->

    <main class="splash-wrapper">

        <section class="splash-card">

            <!-- Decorative top line -->

            <div class="top-decoration">

                <span></span>

                <i class="fa-solid fa-martini-glass-citrus"></i>

                <span></span>

            </div>


            <!-- Logo -->

            <div class="logo-wrapper">

                <div class="logo-glow"></div>

                <img src="../img/logo.jpeg"
                     class="logo"
                     alt="Alleppey Pub and Bar logo">

            </div>


            <!-- Brand -->

            <div class="brand-section">

                <p class="welcome-text">
                    Welcome to
                </p>

                <h1>ALLEPPEY</h1>

                <h2>PUB & BAR ERP</h2>

                <p class="tagline">
                    Good Drinks
                    <span>•</span>
                    Great Food
                    <span>•</span>
                    Best Memories
                </p>

            </div>


            <!-- Feature icons -->

            <div class="feature-row">

                <div class="feature-item">

                    <i class="fa-solid fa-champagne-glasses"></i>

                    <span>Premium Service</span>

                </div>


                <div class="feature-item">

                    <i class="fa-solid fa-utensils"></i>

                    <span>Smart Ordering</span>

                </div>


                <div class="feature-item">

                    <i class="fa-solid fa-chart-line"></i>

                    <span>ERP Management</span>

                </div>

            </div>


            <!-- Loader -->

            <div class="loader-section">

                <div class="loader-header">

                    <span id="loadingText">
                        Initializing system
                    </span>

                    <span id="loadingPercent">
                        0%
                    </span>

                </div>


                <div class="loader">

                    <div class="progress"
                         id="progressBar">

                    </div>

                </div>


                <p class="loading-status">

                    <span class="loading-dot"></span>

                    Preparing your pub management experience

                </p>

            </div>


            <!-- Footer -->

            <div class="splash-footer">

                <i class="fa-solid fa-shield-halved"></i>

                <span>
                    Secure Restaurant Management System
                </span>

            </div>

        </section>

    </main>


    <script src="../js/splash.js?v=7"></script>

</body>

</html>
