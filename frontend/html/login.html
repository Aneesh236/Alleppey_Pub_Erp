<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Alleppey Pub ERP</title>

    <link rel="stylesheet" href="../css/login.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >
</head>

<body>

    <a
    href="role-selection.html"
    class="back-button"
    aria-label="Back to role selection"
>
    <i class="fa-solid fa-arrow-left"></i>
    <span>Back</span>
</a>

    <div class="background-overlay"></div>

    <main class="login-page">

        <div class="login-container">

            <!-- Logo Section -->
            <header class="logo-section">

                <img
                    src="../img/logo.jpeg"
                    alt="Alleppey Pub and Bar logo"
                >

                <h1>ALLEPPEY PUB & BAR</h1>

                <p>Restaurant Management System</p>

            </header>

            <!-- Login Card -->
            <section class="login-card">

                <div class="card-heading">

                    <h2>Welcome Back</h2>

                    <p>Select your role and enter your credentials</p>

                </div>

                <form id="loginForm" novalidate>

                    <!-- Role Selection -->
                    <fieldset class="role-selection">

                        <legend>Select your role</legend>

                        <label class="role-option">

                            <input
                                type="radio"
                                name="role"
                                value="employee"
                            >

                            <span class="role-content">

                                <i class="fa-solid fa-user-tie"></i>

                                Employee

                            </span>

                        </label>

                        <label class="role-option">

                            <input
                                type="radio"
                                name="role"
                                value="admin"
                            >

                            <span class="role-content">

                                <i class="fa-solid fa-user-shield"></i>

                                Administrator

                            </span>

                        </label>

                    </fieldset>

                    <!-- Username -->
                    <div class="input-group">

                        <label for="username">Username</label>

                        <div class="input-box">

                            <i
                                class="fa-solid fa-user left-icon"
                                aria-hidden="true"
                            ></i>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                            >

                        </div>

                    </div>

                    <!-- Password -->
                    <div class="input-group">

                        <label for="password">Password</label>

                        <div class="input-box">

                            <i
                                class="fa-solid fa-lock left-icon"
                                aria-hidden="true"
                            ></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                                aria-label="Show password"
                            >

                                <i
                                    class="fa-solid fa-eye"
                                    aria-hidden="true"
                                ></i>

                            </button>

                        </div>

                    </div>

                    <!-- Options -->
                    <div class="options">

                        <label class="remember-option">

                            <input
                                type="checkbox"
                                id="remember"
                            >

                            Remember me

                        </label>

                        <a href="#" id="forgotPassword">

                            Forgot password?

                        </a>

                    </div>

                    <!-- Login Button -->
                    <button type="submit" id="loginBtn">

                        <i class="fa-solid fa-right-to-bracket"></i>

                        <span>Login</span>

                    </button>

                </form>

                <!-- Demo Credentials -->
                <div class="demo-credentials">

                    <p>
                        <i class="fa-solid fa-circle-info"></i>
                        Demo credentials
                    </p>

                    <div class="credential-list">

                        <span>
                            Employee:
                            <strong>employee / 1234</strong>
                        </span>

                        <span>
                            Admin:
                            <strong>admin / admin123</strong>
                        </span>

                    </div>

                </div>

            </section>

        </div>

    </main>

    <footer>

        <p>&copy; 2026 Alleppey Pub & Bar ERP. All rights reserved.</p>

    </footer>

    <!-- Toast Notification -->
    <div
        id="toast"
        role="status"
        aria-live="polite"
    ></div>

    <script src="../js/login.js"></script>

</body>

</html>
