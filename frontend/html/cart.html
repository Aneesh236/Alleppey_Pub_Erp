<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | Alleppey Pub ERP</title>

    <link rel="stylesheet" href="../css/cart.css?v=7">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header class="cart-header">

    <div class="header-left">
        <button class="back-btn"
                onclick="window.location.href='../html/menu.html'">
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </button>
    </div>

    <div class="header-center">
        <h1>MY CART</h1>
        <span class="order-id">Review Your Order</span>
    </div>

    <div class="header-right">
        <div class="table-box">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cartCount">0 Items</span>
        </div>
    </div>

</header>

<main class="cart-container">

    <section class="cart-left">

        <div class="section-title">
            <h2>Ordered Items</h2>
            <span id="itemCount">0 Items</span>
        </div>

        <div id="cartItems">
            <!-- cart.js will generate items here -->
        </div>

    </section>

    <aside class="cart-summary">

        <h2>Cart Summary</h2>

        <div class="summary-row">
            <span>Items</span>
            <span id="totalItems">0</span>
        </div>

        <div class="summary-row">
            <span>Subtotal</span>
            <span>₹<span id="subtotal">0.00</span></span>
        </div>

        <hr>

        <div class="summary-row total">
            <span>Total</span>
            <span>₹<span id="grandTotal">0.00</span></span>
        </div>

        

        
        <div class="cart-buttons">

            <button class="continue-btn" id="continueBtn">
                <i class="fa-solid fa-utensils"></i>
                Continue Ordering
            </button>

            <button class="clear-btn" id="clearCartBtn">
                <i class="fa-solid fa-trash"></i>
                Clear Cart
            </button>

            <button class="checkout-btn" id="checkoutBtn">
                <i class="fa-solid fa-credit-card"></i>
                Proceed to Checkout
            </button>

        </div>

    </aside>

</main>

<template id="emptyCartTemplate">

    <div class="empty-cart">

        <i class="fa-solid fa-cart-shopping"></i>

        <h2>Your Cart is Empty</h2>

        <p>Browse our menu and add your favourite food & drinks.</p>

        <button class="continue-btn"
                onclick="window.location.href='../html/menu.html'">
            Go to Menu
        </button>

    </div>

</template>

<div id="toast"></div>

<script src="../js/cart.js?v=7"></script>

</body>
</html>
