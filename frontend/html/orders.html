<!DOCTYPE html>
<html lang="en">

<head>

    <script>
        // This legacy localStorage page has been replaced by the shared
        // database-backed order management page.
        window.location.replace("order-management.html");
    </script>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Orders | Alleppey Pub ERP</title>

    <link rel="stylesheet"
          href="../css/orders.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<!-- =========================
     SIDEBAR
========================== -->

<aside class="sidebar">

    <div class="logo">

        <img src="../img/logo.jpeg">

        <h2>ALLEPPEY PUB</h2>

    </div>

    <ul>

        <li>

            <a href="../html/admin-dashboard.html">

                <i class="fa-solid fa-chart-line"></i>

                Dashboard

            </a>

        </li>

        <li class="active">

            <a href="#">

                <i class="fa-solid fa-receipt"></i>

                Orders

            </a>

        </li>

        <li>

            <a href="../html/menu-management.html">

                <i class="fa-solid fa-utensils"></i>

                Menu

            </a>

        </li>

        <li>

            <a href="../html/inventory.html">

                <i class="fa-solid fa-boxes-stacked"></i>

                Inventory

            </a>

        </li>

        <li>

            <a href="../html/reports.html">

                <i class="fa-solid fa-chart-pie"></i>

                Reports

            </a>

        </li>

    </ul>

</aside>

<!-- =========================
     MAIN
========================== -->

<div class="main-content">

<header>

    <div>

        <h1>Orders</h1>

        <p>Manage all customer orders</p>

    </div>

</header>

<!-- =========================
     SEARCH & FILTER
========================== -->

<div class="toolbar">

    <div class="search-box">

        <i class="fa-solid fa-search"></i>

        <input
            type="text"
            id="searchOrder"
            placeholder="Search Order ID or Customer">

    </div>

    <select id="statusFilter">

        <option value="all">

            All Orders

        </option>

        <option value="Pending">

            Pending

        </option>

        <option value="Preparing">

            Preparing

        </option>

        <option value="Completed">

            Completed

        </option>

        <option value="Cancelled">

            Cancelled

        </option>

    </select>

</div>

<!-- =========================
     ORDER STATS
========================== -->

<section class="cards">

    <div class="card">

        <h2 id="totalOrders">

            0

        </h2>

        <p>Total Orders</p>

    </div>

    <div class="card">

        <h2 id="pendingOrders">

            0

        </h2>

        <p>Pending</p>

    </div>

    <div class="card">

        <h2 id="completedOrders">

            0

        </h2>

        <p>Completed</p>

    </div>

    <div class="card">

        <h2 id="revenue">

            ₹0

        </h2>

        <p>Total Revenue</p>

    </div>

</section>

<!-- =========================
     ORDERS TABLE
========================== -->

<section class="orders-table">

    <table>

        <thead>

        <tr>

            <th>Order ID</th>

            <th>Customer</th>

            <th>Table</th>

            <th>Items</th>

            <th>Total</th>

            <th>Status</th>

            <th>Actions</th>

        </tr>

        </thead>

        <tbody id="ordersBody">

            <!-- Loaded from orders.js -->

        </tbody>

    </table>

</section>

</div>

<script src="../js/orders.js"></script>

</body>

</html>
